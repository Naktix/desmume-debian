name: build and publish .deb

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "37 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: debian:trixie

    steps:
      - name: checkout packaging repository
        uses: actions/checkout@v4

      - name: determine latest stable desmume release
        id: release
        run: |
          apt-get update
          apt-get install -y \
            curl \
            jq

          echo "tag=$(curl -fsSL https://api.github.com/repos/TASEmulators/desmume/releases/latest | jq -r '.tag_name')" >> "$GITHUB_OUTPUT"

      - name: check version
        run: |
          [ "$(curl -fsSL https://naktix.github.io/desmume-debian/dists/trixie/main/binary-amd64/Packages 2>/dev/null | grep -A1 '^Package: desmume-gtk$' | grep '^Version:' | cut -d' ' -f2)" != "$(echo '${{ steps.release.outputs.tag }}' | sed 's/^release_//; s/_/./g')-1" ]

      - name: install build dependencies
        run: |
          apt-get update
          apt-get install -y \
            build-essential \
            debhelper-compat \
            fakeroot \
            git \
            meson \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libsdl2-dev \
            libpcap-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            zlib1g-dev \
            reprepro \
            gnupg

      - name: clone repository and build package
        run: |
          git clone --recursive --branch "${{ steps.release.outputs.tag }}" https://github.com/TASEmulators/desmume desmume
          cp -a debian desmume/debian
          cd desmume

          cat > debian/changelog <<EOF
          desmume ($(echo "${{ steps.release.outputs.tag }}" | sed 's/^release_//; s/_/./g')-1) trixie; urgency=medium

            * Package DeSmuME $(echo "${{ steps.release.outputs.tag }}" | sed 's/^release_//; s/_/./g').

           -- Nils Brockelmann <nils.b@tutamail.com>  $(date -R)
          EOF

          dpkg-buildpackage -us -uc -b

          cp "$(find .. -maxdepth 1 -type f -name 'desmume-gtk_*.deb' ! -name '*dbgsym*' -print -quit)" \
            "$GITHUB_WORKSPACE/desmume-gtk.deb"

      - name: import repository signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --export "$GPG_KEY_ID" > desmume.gpg

      - name: build apt repository
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          mkdir -p apt-repo/conf

          cat > apt-repo/conf/distributions <<EOF
          Origin: Nils Brockelmann
          Label: DeSmuME
          Codename: trixie
          Suite: trixie
          Architectures: amd64
          Components: main
          Description: DeSmuME packages
          SignWith: $GPG_KEY_ID
          EOF

          reprepro --basedir apt-repo includedeb trixie ./desmume-gtk.deb

          cp desmume.gpg apt-repo/desmume.gpg
          touch apt-repo/.nojekyll

      - name: configure github pages
        uses: actions/configure-pages@v5

      - name: Upload APT repository for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: apt-repo

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: deploy apt repository
        id: deployment
        uses: actions/deploy-pages@v4
